  <body>
    <!-- Decorative background shapes (hidden from screen readers) -->
    <div class="water-shape water-shape-large" aria-hidden="true"></div>
    <div class="water-shape water-shape-small" aria-hidden="true"></div>
    
    <!-- Main application container -->
    <main class="app-shell" role="main">
      <!-- Header with title and controls -->
      <header class="topbar" role="banner">
        <h1 class="sr-only">Online Notepad - Free Note Taking Application</h1>
        
        <!-- Document title input -->
        <div class="title-group">
          <span class="app-mark" aria-hidden="true">N</span>
          <input 
            id="documentTitle" 
            class="title-input" 
            type="text" 
            value="Untitled" 
            aria-label="Document title - Enter the name of your note"
            inputmode="text"
            spellcheck="false"
          />
        </div>

        <!-- Toolbar with document actions -->
        <div class="toolbar" aria-label="Document actions - Create, open, save, and copy notes">
          <button 
            class="icon-button" 
            id="newDoc" 
            type="button" 
            title="Create a new blank document (Shortcut: Ctrl+Alt+N)" 
            aria-label="New document"
          >
            +
          </button>
          <label 
            class="icon-button file-button" 
            title="Open an existing text file from your device (Shortcut: Ctrl+O)" 
            aria-label="Open text file"
          >
            <span aria-hidden="true">O</span>
            <input 
              id="fileInput" 
              type="file" 
              accept=".txt,.md,.text,text/plain" 
              aria-label="Select a text file to open"
            />
          </label>
          <button 
            class="icon-button" 
            id="downloadDoc" 
            type="button" 
            title="Download your notes as a text file (Shortcut: Ctrl+S)" 
            aria-label="Save/Download text file"
          >
            S
          </button>
          <button 
            class="icon-button" 
            id="copyDoc" 
            type="button" 
            title="Copy all your notes to the clipboard" 
            aria-label="Copy all text to clipboard"
          >
            C
          </button>
        </div>
      </header>

      <!-- Document tabs navigation -->
      <nav class="tabbar" id="tabbar" role="tablist" aria-label="Open documents - Switch between your notes"></nav>

      <!-- Main editor section -->
      <section class="editor-panel" aria-label="Text editor area - Write and edit your notes here">
        <textarea
          id="editor"
          spellcheck="true"
          autofocus
          aria-label="Notepad editor - Type your notes here. Your changes are automatically saved to your browser."
          placeholder="Write your notes with love..."
        ></textarea>
        <!-- Decorative stickers -->
        <div class="text-sticker sticker-love" aria-hidden="true">💧 ❤</div>
        <div class="text-sticker sticker-flower" aria-hidden="true">🌸 💦</div>
      </section>

      <!-- Status bar with document statistics -->
      <footer class="statusbar" role="contentinfo">
        <span id="saveState" aria-live="polite" aria-label="Save status">Draft saved</span>
        <span id="lineCount" aria-live="polite" aria-label="Line count">1 line</span>
        <span id="wordCount" aria-live="polite" aria-label="Word count">0 words</span>
        <span id="charCount" aria-live="polite" aria-label="Character count">0 characters</span>
      </footer>
    </main>
